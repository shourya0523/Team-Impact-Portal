name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The auth tests (apps/api/src/identity) run against a real Postgres: they create and migrate
    # team_impact_test. The mock API's tests don't need it.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/team_impact_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On PRs only run tasks for packages changed since the base branch (and their dependents).
      - name: Set Turborepo filter
        if: github.event_name == 'pull_request'
        run: echo "TURBO_FILTER=--filter=...[origin/${{ github.base_ref }}]" >> "$GITHUB_ENV"

      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test build $TURBO_FILTER
