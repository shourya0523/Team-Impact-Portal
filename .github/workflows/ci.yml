name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # On PRs only run tasks for packages changed since the base branch (and their dependents).
      - name: Set Turborepo filter
        if: github.event_name == 'pull_request'
        run: echo "TURBO_FILTER=--filter=...[origin/${{ github.base_ref }}]" >> "$GITHUB_ENV"

      - run: pnpm format:check
      - run: pnpm turbo run typecheck lint test build $TURBO_FILTER
